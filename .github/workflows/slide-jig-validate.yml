name: Candidate slide jig - upstream suite
on:
  push:
    branches:
      - research/slide-registration-jig-candidate-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-cross-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science geometry toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad libgl1 libglu1-mesa
          python -m pip install -r requirements.txt
      - name: Official harness regressions (frozen 16-task baseline)
        run: |
          mkdir -p validation-logs
          python bench/test_harness.py > validation-logs/test_harness_baseline.log 2>&1 || {
            tail -n 120 validation-logs/test_harness_baseline.log
            exit 1
          }
          tail -n 30 validation-logs/test_harness_baseline.log
      - name: Add candidate to temporary runner task set only
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('bench/tasks.yaml')
          items=yaml.safe_load(p.read_text())
          data=Path('meta/authoring/slide_registration_jig_task_candidate.md').read_text()
          new=yaml.safe_load(data.split('```yaml',1)[1].split('```',1)[0])
          assert len(new)==1 and new[0]['id']=='slide_registration_jig'
          assert not any(x['id']==new[0]['id'] for x in items)
          p.write_text(yaml.safe_dump(items+new,sort_keys=False,allow_unicode=True))
          Path('designs/benchware/slide_registration_jig.scad').write_text(
              Path('bench/reference/slide_registration_jig.scad').read_text())
          print(f'Integrated temporary {len(items)+len(new)}-task set; git worktree only')
          PY
      - name: Author-side 5-case independent regression
        run: python -m unittest meta/authoring/test_slide_registration_jig_geometry.py -v
      - name: Official benchmark reference + cross-task suite
        run: |
          mkdir -p validation-logs
          python bench/build_refs.py --write > validation-logs/build_refs.log 2>&1 || {
            tail -n 140 validation-logs/build_refs.log
            exit 1
          }
          tail -n 120 validation-logs/build_refs.log
          python - <<'PY'
          import json
          p=json.load(open('bench/reference_stats.json'))
          print('CANDIDATE_REFERENCE_STATS_JSON='+json.dumps(p['slide_registration_jig'],sort_keys=True))
          PY
          python bench/build_refs.py > validation-logs/build_refs_frozen.log 2>&1 || {
            tail -n 140 validation-logs/build_refs_frozen.log
            exit 1
          }
          tail -n 60 validation-logs/build_refs_frozen.log
      - name: Archive validation logs and temporary reference stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-registration-jig-validation
          path: |
            validation-logs/
            bench/reference_stats.json
          if-no-files-found: warn
