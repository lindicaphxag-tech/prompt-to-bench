name: Candidate slide jig - upstream suite
on:
  push:
    branches:
      - research/slide-registration-jig-candidate-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-cross-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science geometry toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad libgl1 libglu1-mesa
          python -m pip install -r requirements.txt
      - name: Test original 16-task harness without altering committed benchmark
        run: |
          mkdir -p validation-logs
          cp bench/tasks.yaml /tmp/tasks-with-candidate.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('bench/tasks.yaml')
          items=yaml.safe_load(p.read_text())
          assert len(items)==17 and sum(t['id']=='slide_registration_jig' for t in items)==1
          p.write_text(yaml.safe_dump([t for t in items if t['id']!='slide_registration_jig'],sort_keys=False))
          print('Running legacy harness on its original frozen 16-task population')
          PY
          python bench/test_harness.py > validation-logs/test_harness_baseline.log 2>&1 || {
            tail -n 120 validation-logs/test_harness_baseline.log
            exit 1
          }
          cp /tmp/tasks-with-candidate.yaml bench/tasks.yaml
          tail -n 30 validation-logs/test_harness_baseline.log
      - name: Verify candidate is fully integrated
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,yaml
          items=yaml.safe_load(Path('bench/tasks.yaml').read_text())
          assert len(items)==17 and sum(t['id']=='slide_registration_jig' for t in items)==1
          assert Path('bench/reference/slide_registration_jig.scad').exists()
          assert Path('designs/benchware/slide_registration_jig.scad').exists()
          assert 'slide_registration_jig' in json.loads(Path('bench/reference_stats.json').read_text())
          print('17 task definitions, design and frozen reference stats confirmed')
          PY
      - name: Author-side 5-case independent regression
        run: python -m unittest meta/authoring/test_slide_registration_jig_geometry.py -v
      - name: Official benchmark reference + cross-task suite
        run: |
          mkdir -p validation-logs
          python bench/build_refs.py --write > validation-logs/build_refs.log 2>&1 || {
            tail -n 140 validation-logs/build_refs.log
            exit 1
          }
          tail -n 120 validation-logs/build_refs.log
          python - <<'PY'
          import json
          p=json.load(open('bench/reference_stats.json'))
          print('CANDIDATE_REFERENCE_STATS_JSON='+json.dumps(p['slide_registration_jig'],sort_keys=True))
          PY
          python bench/build_refs.py > validation-logs/build_refs_frozen.log 2>&1 || {
            tail -n 140 validation-logs/build_refs_frozen.log
            exit 1
          }
          tail -n 60 validation-logs/build_refs_frozen.log
      - name: Archive validation logs and temporary reference stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-registration-jig-validation
          path: |
            validation-logs/
            bench/reference_stats.json
          if-no-files-found: warn
